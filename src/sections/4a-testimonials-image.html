<style>
  .feedback-scroll-wrapper {
    overflow: hidden;
    width: 100%;
    padding: 1rem 0 3rem 0;
  }
  .feedback-scroll-track {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    width: max-content;
    /* Auto-scroll animation over 30s */
    animation: feedback-loop 25s linear infinite;
  }
  .feedback-scroll-track:hover {
    animation-play-state: paused;
  }
  .feedback-scroll-item {
    /* 2 cột mỗi màn hình (50vw) */
    width: calc(50vw - 1.5rem);
    max-width: 500px;
    flex-shrink: 0;
    border-radius: 16px;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.05);
    border: 2px solid rgba(212, 175, 55, 0.4);
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(5px);
    transition: transform 0.3s ease, border-color 0.3s ease;
  }
  .feedback-scroll-item:hover {
    transform: translateY(-5px);
    border-color: rgba(212, 175, 55, 0.8);
  }
  .feedback-scroll-item img {
    width: 100%;
    height: auto;
    object-fit: contain;
    display: block;
  }
  
  /* Tính toán dịch chuyển: 50% độ dài track trừ đi một nửa khoảng gap để khớp hoàn hảo */
  @keyframes feedback-loop {
    0% { transform: translateX(0); }
    100% { transform: translateX(calc(-50% - 0.75rem)); }
  }

  @media (max-width: 768px) {
    .feedback-scroll-track {
      gap: 1rem;
    }
    .feedback-scroll-item {
      width: calc(50vw - 1rem); /* Giữ 2 ảnh 1 màn hình trên mobile */
      border-radius: 12px;
    }
    @keyframes feedback-loop {
      0% { transform: translateX(0); }
      100% { transform: translateX(calc(-50% - 0.5rem)); }
    }
  }
</style>
